# JALANKU - Server Configuration (server v2)
# Model FINAL yang dikunci 15 November 2026. Nilai model dan ambang berasal dari
# data/test-final/config_saran.yaml ([ENS-8] di data/test-final/LOG.md). JANGAN diubah.
# Semua path model relatif terhadap root repo.

# Nama yang dilaporkan GET /api/status
nama_model: ensemble-final

# --- Model kotak: ENSEMBLE (C2) ---
# 4 model, digabung per kelas dengan WBF (src/server/ensemble.py).
ensemble_kotak:
  - {bobot: models/ronde2/r2-kotak-v3-960_best.pt, imgsz: 960}
  - {bobot: models/ronde2/r4-kotak-v3-960-seed1_best.pt, imgsz: 960}
  - {bobot: models/ronde2/r4-kotak-v4-960_best.pt, imgsz: 960}
  - {bobot: models/ronde2/r4-kotak-v3-1280_best.pt, imgsz: 1280}
wbf_iou: 0.55
# conf predict() tiap anggota; sesudah WBF baru disaring per kelas dengan conf_kelas
conf_prediksi_kotak: 0.05

# --- Alternatif untuk laptop lemah: SATU model ---
# Hapus/komentari blok ensemble_kotak di atas, lalu aktifkan tiga baris ini:
# nama_model: r2-kotak-v3-960
# model_kotak: models/ronde2/r2-kotak-v3-960_best.pt
# imgsz: 960

# --- Model segmentasi ---
model_seg: models/ronde2/r2-seg-v3_best.pt
imgsz_seg: 640
conf_seg: 0.25

# Inference. GPU dipakai otomatis kalau ada, kalau tidak CPU.
# half: false = fp32, sama dengan evaluasi dan protokol kecepatan yang dikunci.
half: false

# Confidence threshold per class (model kotak, terkunci)
conf_kelas:
  pilar: 0.25
  pohon: 0.25
  tepian: 0.2
  orang: 0.6
  tanaman_pot: 0.25
  kursi: 0.25
  kendaraan: 0.25   # app: dinaikkan dari 0.1 (16 Nov) - alarm merah palsu di dalam ruangan; di kampus deteksi kendaraan asli hanya turun 1-8% frame
  tangga: 0.25

# Object position
zona_tengah: 0.40

# Distance estimation based on bounding box y2
jarak_y2:
  dekat: 0.85
  sedang: 0.65

# Danger weights
bobot_kelas:
  tangga: 3
  tepian: 3
  kendaraan: 3
  pilar: 2
  pohon: 2
  orang: 2
  tanaman_pot: 1
  kursi: 1

# Position multipliers
faktor_posisi:
  kiri: 0.7
  tengah: 1.0
  kanan: 0.7

# Distance multipliers
faktor_jarak:
  dekat: 1.0
  sedang: 0.7
  jauh: 0.4

# Skor (bobot x posisi x jarak) minimal untuk tiap tingkat; di bawahnya tingkat 1
ambang_tingkat:
  3: 2.0
  2: 1.2

# Frame stabilization (objek dan peringatan seg), per X-Sesi
stabil:
  jendela: 3
  minimal: 2

# Segmentation, diukur di ROI bawah-tengah (sepertiga bawah, selebar zona_tengah)
jalur_ambang_terhalang: 0.20   # persen_jalan di bawah ini -> "Jalur terhalang"
seg_tangga_min: 0.05           # tangga >= 5% ROI -> "Tangga di depan" (tingkat 3)
seg_kendaraan_min: 0.50        # jalan_kendaraan >= 50% ROI -> "Area kendaraan, hati-hati"
seg_kosong_minimal: 3          # seg kosong N frame berturut-turut -> "Hati-hati, jalur tidak terlihat" (<= stabil.jendela)

# Aturan peringatan, dipilih dari ablasi 16 Nov (data/aturan-peringatan/hasil_ablasi.md, K3).
# Kembali ke perilaku lama: seg_tangga_stabil_minimal: 2 dan jauh_butuh_seg: false
seg_tangga_stabil_minimal: 3   # "Tangga di depan" (seg) harus jadi kandidat di minimal N dari stabil.jendela frame (<= stabil.jendela; 2 = lama)
jauh_butuh_seg: true           # true = objek kotak "jauh" tidak jadi peringatan saat seg tidak mengeluarkan mask sama sekali di frame itu

# Aturan v1.1, dipilih dari ablasi 19 Nov (data/aturan-v1-1/hasil_ablasi.md; A menyimpang dari aturan pemilihan, lihat bagian 6).
# Kembali ke perilaku v1 (v1-demo): tahan_dekat_ms: 0 dan samping_maks_tingkat: 3 (dan di src/web/suara.js jedaSampingMs: 0)
tahan_dekat_ms: 1500             # A: peringatan objek "di depan, dekat" diulang sampai N ms sesudah hilang (0 = mati); tidak memperpanjang diri
samping_maks_tingkat: 2          # B: objek kiri/kanan paling tinggi tingkat ini (3 = mati) ...
samping_masuk_tengah_min: 0.15   # ... kecuali kotaknya masuk zona tengah >= bagian lebar gambar ini (tetap tingkat normal)
