<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JalanKu</title>
  <meta name="theme-color" content="#16181D">
  <link rel="icon" href="ikon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="ikon/ikon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="ikon/ikon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="zanite.css">
</head>
<body>
  <video id="kamera" playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="layar-awal">
    <img src="ikon/logo.svg" width="112" height="112" alt="">
    <h1>JalanKu</h1>
    <p>Pendamping jalan kaki yang mendeteksi rintangan di depan.</p>
  </div>

  <canvas id="kanvas" hidden></canvas>

  <main>
    <div id="atas">
      <div id="status" aria-live="polite">
        <div class="baris">
          <span id="status-ikon" aria-hidden="true"></span>
          <span id="status-teks">Tekan Mulai.</span>
        </div>
        <div id="status-detail" hidden></div>
      </div>
      <div id="zona" aria-hidden="true">
        <div data-z="kiri">KIRI</div>
        <div data-z="tengah">TENGAH</div>
        <div data-z="kanan">KANAN</div>
      </div>
      <div id="info"></div>
      <div id="zanite-status" aria-hidden="true" hidden></div>
    </div>

    <div id="panel" hidden>
      <label>
        <span class="judul-atur"><span>Jeda kirim gambar</span><span class="nilai"><span id="nilai-kirim">200</span> ms</span></span>
        <input type="range" id="atur-kirim" min="100" max="1000" step="50" value="200">
      </label>
      <label>
        <span class="judul-atur"><span>Jeda ulang suara</span><span class="nilai"><span id="nilai-ulang">4</span> detik</span></span>
        <input type="range" id="atur-ulang" min="2" max="10" step="1" value="4">
      </label>
      <label>
        <span class="judul-atur"><span>Jeda ulang benda ringan</span><span class="nilai"><span id="nilai-ringan">8</span> detik</span></span>
        <input type="range" id="atur-ringan" min="0" max="15" step="1" value="8">
      </label>
      <label>
        <span class="judul-atur"><span>Kecepatan bicara</span><span class="nilai"><span id="nilai-rate">1.0</span></span></span>
        <input type="range" id="atur-rate" min="0.5" max="2" step="0.1" value="1">
      </label>
      <label>
        <span class="judul-atur"><span>Volume</span><span class="nilai"><span id="nilai-volume">100</span>%</span></span>
        <input type="range" id="atur-volume" min="0" max="100" step="10" value="100">
      </label>
      <button id="salin-log-zanite" type="button" hidden>Salin log Zanite</button>
      <textarea id="teks-log-zanite" readonly hidden rows="6" aria-label="Log Zanite, pilih lalu salin"></textarea>
    </div>

    <button id="tombol-mode-suara" aria-label="Mode suara: layar gelap, peringatan lewat suara dan getar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M3.5 9.5h3.5L11.5 5.5v13L7 14.5H3.5z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 9a4.2 4.2 0 0 1 0 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 6.2a8.2 8.2 0 0 1 0 11.6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Mode suara</button>
    <div id="baris-kecil">
      <button id="tombol-bisu" aria-pressed="false">Bisu</button>
      <button id="tombol-atur" aria-expanded="false">Atur</button>
    </div>
    <button id="tombol-mulai">Mulai</button>
  </main>

  <!-- Di luar main: main dibuat inert selama mode suara -->
  <div id="layar-suara" hidden role="button" tabindex="0" aria-label="Mode suara aktif. Tekan lama dua detik untuk keluar.">
    <span aria-hidden="true">Mode suara aktif</span>
    <span id="teks-tahan" aria-hidden="true">Tekan lama 2 detik untuk keluar</span>
  </div>

  <!-- Pendar tepi Zanite: hiasan keadaan (zanite.js mengisi data-keadaan), bukan tombol, tidak menahan sentuhan -->
  <div id="zanite-pendar" aria-hidden="true" data-keadaan="mati"></div>

  <script src="mock.js"></script>
  <script src="suara.js"></script>
  <script src="server.js"></script>
  <script src="zanite-cocok.js"></script>
  <script src="zanite-aturan.js"></script>
  <script src="zanite.js"></script>
  <script src="app.js"></script>
</body>
</html>
