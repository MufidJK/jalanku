<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zanite tes kata bangun (kalibrasi 3)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px; background: #111; color: #eee; font: 14px/1.35 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  button, select { font-size: 15px; padding: 8px 12px; border-radius: 4px; border: 0; }
  button { background: #1f5fbf; color: #fff; }
  button.go { background: #1b8a3a; }
  button.go.on { background: #b3261e; }
  button:disabled { background: #444; }
  video { width: 120px; height: 90px; background: #000; object-fit: cover; }
  #live { font-size: 20px; min-height: 2.6em; padding: 6px 8px; background: #1b2633; border-radius: 4px; color: #cfe3ff; }
  #live.wake { background: #1b5e2a; color: #fff; }
  #status { color: #ffb86b; min-height: 1.3em; margin: 4px 0; }
  #cnt { font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; margin: 6px 0; color: #9fd1a8; }
  #log { height: 38vh; overflow-y: auto; background: #181818; border: 1px solid #333; font: 12px/1.4 ui-monospace, Consolas, monospace; padding: 4px; }
  #log div { border-bottom: 1px solid #222; word-break: break-word; }
  #log .i { color: #888; }
  #log .f { color: #ddd; }
  #log .w { color: #7fe08f; font-weight: bold; }
  #log .s { color: #ffb86b; }
  #log .e { color: #ff7b72; }
  #log .m { color: #8ec5ff; }
  #log .r { color: #d6a0ff; }
  textarea { width: 100%; font: 12px ui-monospace, Consolas, monospace; background: #222; color: #ccc; border: 1px solid #444; }
  label { white-space: nowrap; }
</style>
</head>
<body>
<h1>Zanite: tes kata bangun di Chrome HP <small style="color:#888">(kalibrasi 3)</small></h1>
<div class="row">
  <button id="go" class="go">Mulai</button>
  <button id="app">Putar suara app</button>
  <button id="salin">Salin hasil</button>
  <video id="vid" playsinline muted></video>
</div>
<div class="row">
  <label><input type="checkbox" id="jeda"> Jeda mic saat app bicara</label>
  <label><input type="checkbox" id="fuzzy" checked> Aturan fuzzy</label>
  <label>Diam utama (ms) <input type="number" id="diam" min="0" step="100" style="width:5em"></label>
  <label>WEAK_MS <input type="number" id="weak" min="0" step="100" style="width:5em"></label>
  <label>Fase tes
    <select id="fase">
      <option value="bebas">0 bebas</option>
      <option value="diam">1 diam 5 menit</option>
      <option value="zanite">2 ucap Zanite (tanpa balasan)</option>
      <option value="kalimat">3 kalimat biasa (tanpa balasan)</option>
      <option value="4a">4a Zanite, jelaskan sekitar (satu napas)</option>
      <option value="4b">4b Zanite, tunggu balasan, lalu jelaskan sekitar</option>
      <option value="suara">S suara app (lama fase 4)</option>
      <option value="jelaskan">J jelaskan (lama fase 5)</option>
    </select>
  </label>
</div>
<div id="status">Belum mulai.</div>
<div id="live">(transkrip langsung)</div>
<div id="cnt"></div>
<div id="log"></div>
<div style="margin-top:8px">
  <div>Varian kata bangun (pisah koma, gampang ditambah):</div>
  <textarea id="varian" rows="2"></textarea>
  <div style="margin-top:6px">Varian hanya-sendiri (menyala hanya bila diucap sendirian atau langsung diikuti perintah):</div>
  <textarea id="varian2" rows="2"></textarea>
</div>
<script src="/zanite/cocok.js"></script>
<script src="/zanite/app.js"></script>
</body>
</html>
